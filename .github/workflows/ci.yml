# CI - epy_books (public, MIT).
#
# The one suite dependency is epy_export, published on no index, so it is
# installed from its repository at the release tag the other editors use.
# The tests run on Linux and Windows: the book pipeline is pure Python, but
# the application module imports PySide6, and a platform that cannot build
# the package must fail here rather than in a user's installer.
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.11.0"
      - name: ruff check
        run: ruff check src tests

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install the shared engine (not on PyPI)
        run: >-
          pip install "epy_export[pdf,qt] @ git+https://github.com/estructuraPy/epy_export.git@v0.5.1"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Test with the coverage gate
        run: python -m pytest

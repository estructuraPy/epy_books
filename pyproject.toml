[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epy_books"
version = "0.1.2"
description = "Book authoring, editorial design and publication for the ePy suite."
authors = [{ name = "Ing. Angel Navarro-Mora M.Sc.", email = "ahnavarro@itcr.ac.cr" }]
maintainers = [{ name = "ANM Ingenieria", email = "ahnavarro@itcr.ac.cr" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Editors",
    "Topic :: Office/Business",
]
dependencies = [
    "epy_export>=0.4.0",
    "PySide6>=6.6",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://www.anmingenieria.com/"
Repository = "https://github.com/estructuraPy/epy_books"
Issues = "https://github.com/estructuraPy/epy_books/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.11.0"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
epy_books = "epy_books.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epy_books"]
exclude = ["src/epy_books/_core/_packaging"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --cov --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/epy_suite_connect/_packaging/*",
    "*/epy_books/_legacy_books/*",
    "*/epy_books/app.py",
    "*/epy_books/_ui/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
extend-exclude = [
    "src/*/epy_suite_connect/_packaging",
    "src/epy_books/_legacy_books",
    ".claude",
]
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"build.py" = ["D"]
"housekeeper.py" = ["E501", "D103"]
"epy_books.spec" = ["D", "F821", "E501"]
"examples/**/*.py" = ["D", "E402", "E501"]
